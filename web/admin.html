<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Admin - JEJAK</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><a class="merek" href="#" aria-label="JEJAK"><b>JEJAK</b></a><span class="pengguna"><span class="avatar" id="avatar" aria-hidden="true"></span><span class="sapa"><span class="halo">Halo, </span><span id="nama"></span></span><button class="keluar" onclick="keluar()">Keluar <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H5v16h4M16 8l4 4-4 4M20 12H9"/></svg></button></span></header>
<main>
  <h1>Dashboard Admin</h1>
  <p class="redup">Ringkasan data PKL.</p>
  <div class="kartu" id="info">Memuat data...</div>
  <div class="kartu redup">Halaman Data Siswa dan Penempatan menyusul. Untuk sementara, data diisi lewat dashboard Supabase.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async () => {
  if (!await wajibRole("admin")) return;
  const el = document.getElementById("info");
  const { count, error } = await db.from("students").select("id", { count: "exact", head: true });
  el.textContent = error
    ? "Data belum bisa dimuat: " + error.message
    : "Siswa terdaftar: " + count;
})();
</script>
</body>
</html>
